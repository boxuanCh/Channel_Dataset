name: tests

on:
  push:
  pull_request:

jobs:
  numpy-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,wireless-numpy]"
      - run: python -m pytest -m "not torch and not cuda"

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not cuda"

  combined-current:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,wireless]"
      - run: python -m pytest -m "not cuda"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[docs,wireless-numpy]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  notebooks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,notebooks]"
      - run: python -m pytest tests/notebooks

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples benchmarks
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import channel_dataset; assert channel_dataset.__version__ == '0.1.0'"
      - name: Verify installed IEEE 802.11 resources
        run: >-
          python -c "from channel_dataset.channels.wireless.ieee80211 import
          load_ieee80211_profile, load_tgax_outdoor_profile;
          assert load_ieee80211_profile('F').name == 'F';
          assert 'outdoor_umi' in load_tgax_outdoor_profile().scenarios"
      - name: Verify installed TR 37.885 resources
        run: >-
          python -c "from channel_dataset.channels.wireless.tr37885 import
          load_cdl_profile, load_urban_parameters, load_vehicle_antenna_profile;
          assert len(load_cdl_profile('nlos').delays_s) == 23;
          assert load_urban_parameters()['standard_version'] == '15.3.0';
          assert load_vehicle_antenna_profile(1).locations == ('front', 'rear')"
