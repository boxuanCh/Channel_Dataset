schema_version: 1
standard: 3GPP TR 37.885
standard_version: 15.3.0
scenario: urban_grid
source:
  clauses: [6.1.2, 6.2, 6.2.1, 6.2.3, Annex A]
  tables: [6.2-1, 6.2.1-1, 6.2.3-1, A-1]
  url: https://atisorg.s3.amazonaws.com/archive/3gpp-documents/Rel15/ATIS.3GPP.37.885.V1530.pdf
units: {distance: m, speed: km/h, frequency: GHz, loss: dB, time: s}
grid:
  intersection_spacing_m: [433.0, 250.0]
  minimum_area_m: [1299.0, 750.0]
  lanes_per_direction: 2
  lane_width_m: 3.5
  sidewalk_width_m: 3.0
  street_width_m: 20.0
vehicle_types:
  1: {name: passenger_low_antenna, length_m: 5.0, width_m: 2.0, height_m: 1.6, antenna_height_m: 0.75}
  2: {name: passenger_high_antenna, length_m: 5.0, width_m: 2.0, height_m: 1.6, antenna_height_m: 1.6}
  3: {name: truck_bus, length_m: 13.0, width_m: 2.6, height_m: 3.0, antenna_height_m: 3.0}
vehicle_antenna:
  option: 1
  carrier_frequency_hz: 6000000000.0
  source_table: [6.1.4-8, 6.1.4-9]
  maximum_element_gain_db: 3.0
  element_spacing_wavelengths: 0.5
  tilt_degrees: 90.0
  types:
    1:
      locations: [front, rear]
      bearing_degrees: [0.0, 180.0]
      baseline_array_per_location: [1, 1, 2, 1, 1]
      optional_array_per_location: [1, 2, 2, 1, 1]
    2:
      locations: [rooftop]
      bearing_degrees: [0.0]
      baseline_array: [1, 2, 2, 1, 1]
      optional_array: [1, 4, 2, 1, 1]
    3:
      locations: [front, rear]
      bearing_degrees: [0.0, 180.0]
      baseline_array_per_location: [1, 1, 2, 1, 1]
      optional_array_per_location: [1, 2, 2, 1, 1]
mobility:
  update_interval_s: 0.1
  minimum_bumper_gap_m: 2.0
  exponential_gap_mean_time_s: 2.0
  option_a:
    vehicle_type_probabilities: [0.0, 1.0, 0.0]
    lane_speeds_kmh: [60.0, 60.0, 60.0, 60.0]
    turn_probabilities: {straight: 0.5, left: 0.25, right: 0.25}
  option_b:
    vehicle_type_probabilities: [0.2, 0.6, 0.2]
    east_west_lane_speeds_kmh: [60.0, 50.0, 25.0, 15.0]
    north_south_lane_speeds_kmh: [0.0, 0.0, 0.0, 0.0]
link_state:
  urban_los_probability: min(1, 1.05 * exp(-0.0114 * distance_m))
path_loss:
  los_nlosv: {constant_db: 38.77, distance_coefficient: 16.7, frequency_coefficient: 18.2, shadow_std_db: 3.0}
  nlos: {constant_db: 36.85, distance_coefficient: 30.0, frequency_coefficient: 18.9, shadow_std_db: 4.0}
fast_fading:
  los: {clusters: 12, rays_per_cluster: 20, delay_scaling: 3.0, xpr_mean_db: 9.0, xpr_std_db: 3.0, cluster_shadow_std_db: 4.0, k_mean_db: 3.48, k_std_db: 2.0, shadow_correlation_distance_m: 10.0}
  nlosv: {clusters: 19, rays_per_cluster: 20, delay_scaling: 2.1, xpr_mean_db: 8.0, xpr_std_db: 3.0, cluster_shadow_std_db: 4.0, k_mean_db: 0.0, k_std_db: 4.5, shadow_correlation_distance_m: 13.0}
  nlos: {clusters: 19, rays_per_cluster: 20, delay_scaling: 2.1, xpr_mean_db: 8.0, xpr_std_db: 3.0, cluster_shadow_std_db: 4.0, k_mean_db: null, k_std_db: null, shadow_correlation_distance_m: 13.0}
